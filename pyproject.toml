[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-autorun"]

[project]
authors = [
  {name = "Frank Hoffmann", email = "15r10nk@polarbit.de"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy"
]

dependencies = [
]
description = 'PEP 690 like lazy imports for python'
keywords = []
license = "MIT"
name = "lazy-imports-lite"
readme = "README.md"
requires-python = ">=3.8"
version="0.1.1"


[project.scripts]
lazy-imports-lite = "lazy_imports_lite.__main__:main"


[project.urls]
Documentation = "https://github.com/15r10nk/lazy-imports-lite#readme"
Issues = "https://github.com/15r10nk/lazy-imports-lite/issues"
Source = "https://github.com/15r10nk/lazy-imports-lite"


[dependency-groups]
cog = [
    "cogapp>=3.4.1",
]
dev = [
    "commitizen==4.16.5; python_version >= '3.10'",
    "pytest-freezer>=0.4.8",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "coverage[toml]>=7.6.1",
    "coverage-enable-subprocess>=1.0",
  "inline-snapshot[black]",
    "astunparse",
    "pip>=25.0.1",
    "scriv==1.8.0; python_version >= '3.10'",
    "uv>=0.7"
]


[tool.black]
target-version = ["py38"]

[tool.commitizen]
changelog_incremental = true
major_version_zero = true
tag_format = "v$major.$minor.$patch$prerelease"
update_changelog_on_bump = true
version_files = [
  "src/lazy_imports_lite/__init__.py:version"
]
version_provider = "pep621"

[tool.coverage.paths]
lazy_imports_lite = ["src/lazy_imports_lite", "*/lazy-imports-lite/src/lazy_imports_lite"]
tests = ["tests", "*/lazy-imports-lite/tests"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "assert False", "raise NotImplemented", "\\.\\.\\."]

[tool.coverage.run]
branch = true
parallel = true
data_file = "$TOP/.coverage"
source_pkgs = ["lazy_imports_lite", "tests"]
source=["src"]


[tool.hatch.build.targets.wheel.hooks.autorun]
dependencies = ["hatch-autorun"]

code = """
from lazy_imports_lite._loader import setup
setup()
"""

[tool.hatch.envs.cov.scripts]
github=[
    "- rm htmlcov/*",
    "gh run download -n html-report -D htmlcov",
    "xdg-open htmlcov/index.html",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12","3.13","pypy3.9","pypy3.10"]

[tool.hatch.envs.hatch-test]
extra-dependencies = [
    "inline-snapshot[black]",
    "astunparse",
    "pip>=25.0.1",
    "uv>=0.7"
]
env-vars.TOP = "{root}"

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report=["coverage report","coverage html"]



[tool.hatch.envs.docs]
dependencies = [
  "mike>=2",
  "mkdocs>=1.4.2",
  "mkdocs-material[imaging]>=8.5.10",
  "mkdocstrings>=0.19.0"
]
scripts.build = "mkdocs build {args}"
scripts.deploy = "mike {args}"
scripts.serve = ["mkdocs serve {args}"]

[tool.hatch.version]
path = "src/lazy_imports_lite/__init__.py"



[tool.hatch.envs.types]
extra-dependencies = [
  "inline-snapshot[black,dirty-equals]",
  "mypy>=1.0.0",
  "hypothesis>=6.75.5",
  "pydantic",
  "attrs",
  "typing-extensions"
]

[[tool.hatch.envs.types.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12","3.13"]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/lazy_imports_lite tests}"
